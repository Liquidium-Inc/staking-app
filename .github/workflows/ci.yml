name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm secretlint
      - run: pnpm lint
      - run: pnpm test -- --run --reporter=dot
