packages:
  - .

# Keep false: @omnisat/lasereyes-core depends on a pinned alkanes GitHub tarball (kungfuflex/alkanes@7a3326b).
blockExoticSubdeps: false
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

allowBuilds:
  '@posthog/cli': true
  cbor-extract: true
  core-js: false
  esbuild: true
  secp256k1: true
  unrs-resolver: true

