packages:
  - .

blockExoticSubdeps: false
minimumReleaseAgeStrict: true

allowBuilds:
  '@posthog/cli': true
  cbor-extract: true
  core-js: false
  esbuild: true
  secp256k1: true
  unrs-resolver: true

overrides:
  baseline-browser-mapping: 2.11.10
  '@isaacs/brace-expansion@<=5.0.0': 5.0.1
  # Keep PostHog transitive ranges behind pnpm 11's release-age quarantine.
  '@posthog/core': 1.48.10
  '@posthog/types': 1.405.3
  '@tootallnate/once@<2.0.1': 2.0.1
  'ajv@>=7.0.0-alpha.0 <8.18.0': 8.20.0
  axios: ^1.16.0
  'bn.js@>=4.0.0 <4.12.3': 4.12.3
  'bn.js@>=5.0.0 <5.2.3': 5.2.5
  esbuild: ^0.28.1
  'flatted@<3.4.2': 3.4.2
  form-data: ^4.0.6
  'glob@>=11.0.0 <11.1.0': 11.1.0
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'lodash@>=4.0.0 <=4.17.23': 4.18.1
  'minimatch@>=3.0.0 <3.1.4': 3.1.5
  'minimatch@>=9.0.0 <9.0.7': 9.0.7
  'minimatch@>=10.0.0 <10.2.3': 10.2.5
  path-to-regexp: ^8.4.0
  'picomatch@>=2.0.0 <2.3.2': 2.3.2
  'picomatch@>=4.0.0 <4.0.4': 4.0.5
  'rollup@>=4.0.0 <4.59.0': 4.59.0
  sharp: ^0.35.0
  'smol-toml@<1.6.1': 1.6.1
  'postcss@>=8.0.0 <8.5.26': 8.5.26
  'tar@>=7.0.0 <7.5.21': 7.5.21
  'tmp@<0.2.7': 0.2.7
  undici: ^7.28.0
  'valibot@>=0.31.0 <1.2.0': 1.4.2
  ws: ^8.21.0
  'yaml@>=2.0.0 <2.8.3': 2.9.0

# Next.js 16.3.3 contains critical security fixes and cannot wait for the 24-hour quarantine.
minimumReleaseAgeExclude:
  - '@next/env@16.3.3'
  - '@next/eslint-plugin-next@16.3.3'
  - '@next/mdx@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - eslint-config-next@16.3.3
  - next@16.3.3
